# Existing privileged PR automation is intentionally isolated to these workflows:
# they do not checkout pull request head code, and they only comment or set status.
rules:
  stale-action-refs:
    ignore:
      # lunariajs/action has no tag refs; keep the branch commit hash-pinned.
      - lunaria.yml:40
  concurrency-limits:
    ignore:
      # Stateless, idempotent check. Concurrency groups cancel superseded pending
      # runs even with `cancel-in-progress: false`, which would leave a failed
      # check on the release PR's head commit (`main`).
      - enforce-release-source.yml
  dangerous-triggers:
    ignore:
      - enforce-release-source.yml
      - dependency-diff-comment.yml
      - lunaria.yml
      - semantic-pull-requests.yml
      - welcome-close.yml
      - welcome-open.yml
